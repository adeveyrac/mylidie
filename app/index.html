<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mylidie App</title>
<link rel="icon" href="/favicon.svg">
</head>
<body>
<style>
  :root{
    --bg:#eceae2; --surface:#ffffff; --surface-2:#f5f3ec; --surface-3:#efece2;
    --ink:#24231c; --ink-soft:#5c5a4e; --ink-faint:#928f80;
    --line:#e6e2d6; --line-strong:#d8d3c4;
    --brand:#3a3a28; --brand-2:#4d4c36; --btn-bg:#3a3a28; --btn-fg:#fff;
    --resa:#c0392b; --resa-bg:#fbeae7; --resa-line:#e7b7ae;
    --info:#2f7d5b; --info-bg:#e7f2ec; --info-line:#b0d4c2;
    --annul:#5b6b7a; --annul-bg:#eef1f4; --annul-line:#ccd6de;
    --rappel:#b5850f; --rappel-bg:#fbf1d8; --rappel-line:#e8cf93;
    --inconnu:#6d4b9f; --inconnu-bg:#efe9f6; --inconnu-line:#d3c2e6;
    --urgence:#d9480f; --urgence-bg:#fdece3; --urgence-line:#f3c2a4;
    --bubble-out:#3a3a28; --bubble-out-fg:#f5f3ea;
    --shadow:0 1px 2px rgba(40,38,28,.05),0 6px 18px rgba(40,38,28,.06);
    --fs-xs:11px; --fs-sm:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:19px; --fs-2xl:24px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#131209; --surface:#201e18; --surface-2:#29271f; --surface-3:#2f2c22;
    --ink:#f2efe5; --ink-soft:#bcb8a8; --ink-faint:#867f6d; --line:#322f25; --line-strong:#3d3a2e;
    --brand:#cdbb8e; --brand-2:#d8c89e; --btn-bg:#cbb98d; --btn-fg:#231f17;
    --resa:#e8776b; --resa-bg:#38211d; --resa-line:#5a332c; --info:#5cbd90; --info-bg:#15332a; --info-line:#28503f;
    --annul:#9fb0bf; --annul-bg:#232a30; --annul-line:#3a454e;
    --rappel:#e5bd52; --rappel-bg:#332a14; --rappel-line:#544527; --inconnu:#b79ae0; --inconnu-bg:#2c2338; --inconnu-line:#463a5c;
    --urgence:#f0885c; --urgence-bg:#3a2116; --urgence-line:#5e3722;
    --bubble-out:#cbb98d; --bubble-out-fg:#231f17; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  }}
  :root[data-theme="light"]{
    --bg:#eceae2; --surface:#fff; --surface-2:#f5f3ec; --surface-3:#efece2;
    --ink:#24231c; --ink-soft:#5c5a4e; --ink-faint:#928f80; --line:#e6e2d6; --line-strong:#d8d3c4;
    --brand:#3a3a28; --brand-2:#4d4c36; --btn-bg:#3a3a28; --btn-fg:#fff;
    --resa:#c0392b; --resa-bg:#fbeae7; --resa-line:#e7b7ae; --info:#2f7d5b; --info-bg:#e7f2ec; --info-line:#b0d4c2;
    --annul:#5b6b7a; --annul-bg:#eef1f4; --annul-line:#ccd6de;
    --rappel:#b5850f; --rappel-bg:#fbf1d8; --rappel-line:#e8cf93; --inconnu:#6d4b9f; --inconnu-bg:#efe9f6; --inconnu-line:#d3c2e6;
    --urgence:#d9480f; --urgence-bg:#fdece3; --urgence-line:#f3c2a4;
    --bubble-out:#3a3a28; --bubble-out-fg:#f5f3ea; --shadow:0 1px 2px rgba(40,38,28,.05),0 6px 18px rgba(40,38,28,.06);
  }
  :root[data-theme="dark"]{
    --bg:#131209; --surface:#201e18; --surface-2:#29271f; --surface-3:#2f2c22;
    --ink:#f2efe5; --ink-soft:#bcb8a8; --ink-faint:#867f6d; --line:#322f25; --line-strong:#3d3a2e;
    --brand:#cdbb8e; --brand-2:#d8c89e; --btn-bg:#cbb98d; --btn-fg:#231f17;
    --resa:#e8776b; --resa-bg:#38211d; --resa-line:#5a332c; --info:#5cbd90; --info-bg:#15332a; --info-line:#28503f;
    --annul:#9fb0bf; --annul-bg:#232a30; --annul-line:#3a454e;
    --rappel:#e5bd52; --rappel-bg:#332a14; --rappel-line:#544527; --inconnu:#b79ae0; --inconnu-bg:#2c2338; --inconnu-line:#463a5c;
    --urgence:#f0885c; --urgence-bg:#3a2116; --urgence-line:#5e3722;
    --bubble-out:#cbb98d; --bubble-out-fg:#231f17; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs-base);-webkit-font-smoothing:antialiased;}
  .scrollwrap{overflow-x:auto;}
  .workspace{display:grid;grid-template-columns:264px 372px minmax(0,1fr);height:100dvh;min-width:1040px;background:var(--bg);}
  .col{min-height:0;display:flex;flex-direction:column;}
  .side{background:var(--surface);border-right:1px solid var(--line);}
  .list{background:var(--bg);border-right:1px solid var(--line);}
  .detail{background:var(--bg);}

  /* ---- left ---- */
  .brandbox{padding:16px 16px 14px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center;cursor:pointer;}
  .brandbox:hover{background:var(--surface-2)}
  .logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .logo{width:40px;height:40px;border-radius:11px;background:var(--brand);color:#f5f3ea;display:grid;place-items:center;overflow:hidden;
    font-family:var(--serif);font-style:italic;font-size:20px;flex:0 0 auto;}
  @media(prefers-color-scheme:dark){.logo{background:var(--btn-bg);color:var(--btn-fg)}}
  :root[data-theme="dark"] .logo{background:var(--btn-bg);color:var(--btn-fg)}
  .brandbox .bx{flex:1;min-width:0}
  .brandbox .hn{font-weight:700;font-size:var(--fs-base);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .brandbox .hp{font-size:var(--fs-xs);color:var(--ink-faint);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px;margin-top:2px;}
  .brandbox .hp .fr{font-size:12px}
  .brandbox .chev{color:var(--ink-faint);font-size:15px}

  .searchbox{padding:12px 14px;}
  .searchbox input{width:100%;padding:9px 12px 9px 32px;border-radius:9px;border:1px solid var(--line-strong);
    background:var(--surface-2);color:var(--ink);font-family:var(--sans);font-size:var(--fs-sm);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='15' height='15' fill='none' stroke='%23928f80' stroke-width='2' viewBox='0 0 24 24'><circle cx='11' cy='11' r='7'/><path d='M21 21l-4-4'/></svg>");
    background-repeat:no-repeat;background-position:10px center;}
  .searchbox input:focus{outline:2px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:1px}

  .navlbl{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);padding:6px 18px 6px;}
  .nav{padding:0 10px;display:flex;flex-direction:column;gap:2px;}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:none;background:transparent;
    color:var(--ink-soft);font-family:var(--sans);font-size:var(--fs-sm);cursor:pointer;text-align:left;width:100%;}
  .navitem:hover{background:var(--surface-2)}
  .navitem[aria-current="true"]{background:var(--surface-3);color:var(--ink);font-weight:600;}
  .navitem .dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;}
  .navitem .lbl{flex:1}
  .navitem .cnt{font-size:var(--fs-xs);color:var(--ink-faint);font-variant-numeric:tabular-nums;
    background:var(--surface-3);padding:1px 7px;border-radius:999px;}
  .navitem[aria-current="true"] .cnt{background:var(--surface)}
  .d-resa{background:var(--resa)} .d-info{background:var(--info)} .d-annulation{background:var(--annul)}
  .d-rappel{background:var(--rappel)} .d-inconnu{background:var(--inconnu)} .d-all{background:var(--ink-faint)}
  .d-urgence{background:var(--urgence)}

  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;}
  .agentline{display:flex;align-items:center;gap:9px;font-size:var(--fs-sm);color:var(--ink-soft);}
  .agentline .adot{width:8px;height:8px;border-radius:50%;background:#5cbd90;box-shadow:0 0 0 3px color-mix(in srgb,#5cbd90 20%,transparent);}
  .usermenu{position:relative;margin-top:11px}
  .memberline{display:flex;align-items:center;gap:9px;width:100%;padding:6px;border:0;border-radius:10px;
    background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;}
  .memberline:hover{background:var(--surface-2)}
  .memberline .mav{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#f5f3ea;display:grid;place-items:center;font-size:var(--fs-xs);font-weight:700;flex:0 0 auto}
  @media(prefers-color-scheme:dark){.memberline .mav{background:var(--btn-bg);color:var(--btn-fg)}}
  :root[data-theme="dark"] .memberline .mav{background:var(--btn-bg);color:var(--btn-fg)}
  .memberline .mtxt{flex:1;min-width:0}
  .memberline .mn{font-size:var(--fs-sm);display:block} .memberline .mv{font-size:var(--fs-xs);color:var(--ink-faint);display:block}
  .memberline .chev{color:var(--ink-faint);font-size:14px}
  .menu{position:absolute;bottom:calc(100% + 6px);left:0;right:0;z-index:20;background:var(--surface);
    border:1px solid var(--line-strong);border-radius:11px;box-shadow:var(--shadow);padding:5px;
    display:flex;flex-direction:column;gap:2px}
  .menu[hidden]{display:none}
  .mi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;color:var(--ink);
    font:inherit;font-size:var(--fs-sm);padding:9px 10px;border-radius:8px;cursor:pointer}
  .mi:hover{background:var(--surface-2)}
  .mi.danger{color:var(--resa)}
  .mi[hidden]{display:none}

  /* ---- administration (reserve au compte plateforme) ---- */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(20,19,12,.45);
    display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow-y:auto}
  .modal[hidden]{display:none}
  .sheet{background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.28);width:520px;max-width:100%;padding:20px 22px 22px}
  .sheet h2{font-size:var(--fs-lg);margin:0;letter-spacing:-.2px}
  .sheet .sh{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .sheet .sh .x{margin-left:auto;border:0;background:none;color:var(--ink-faint);font-size:22px;
    line-height:1;cursor:pointer;padding:2px 6px;border-radius:8px;font-family:inherit}
  .sheet .x:hover{background:var(--surface-2);color:var(--ink)}
  .sheet .lead{font-size:var(--fs-sm);color:var(--ink-soft);margin:0 0 16px;line-height:1.5}
  .sheet fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 15px 16px;margin:0 0 14px}
  .sheet legend{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.6px;
    color:var(--ink-faint);padding:0 6px;font-weight:600}
  .fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .fld label{font-size:var(--fs-xs);color:var(--ink-soft)}
  .fld input,.fld select{padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--surface-2);color:var(--ink);font:inherit;font-size:var(--fs-sm)}
  .fld input:focus,.fld select:focus{outline:2px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:1px}
  .fld .hint{font-size:var(--fs-xs);color:var(--ink-faint)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .sheet .go{padding:10px 14px;border:0;border-radius:9px;background:var(--btn-bg);color:var(--btn-fg);
    font:inherit;font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:transform 100ms ease-out}
  .sheet .go:active{transform:scale(.98)}
  .sheet .go[disabled]{opacity:.55;cursor:default}
  .note{font-size:var(--fs-sm);margin:9px 0 0;min-height:17px;line-height:1.45}
  .note.err{color:var(--resa)} .note.ok{color:var(--info)}
  .sheet h2.bad{color:var(--resa)}
  .composer .cnote.err{color:var(--resa);font-weight:600}
  .linkout{width:100%;margin-top:8px;padding:9px 11px;border:1px solid var(--line-strong);
    border-radius:9px;background:var(--surface-2);color:var(--ink-soft);font:inherit;
    font-size:var(--fs-xs);cursor:pointer}
  @media (max-width:900px){.row2{grid-template-columns:1fr}}

  /* ---- middle ---- */
  .list-head{padding:16px 18px 10px;}
  .list-head .lt{display:flex;align-items:center;gap:8px;font-size:var(--fs-xl);font-weight:700;letter-spacing:-.3px;}
  .btag{background:var(--inconnu);color:#fff;font-size:10px;padding:2px 8px;border-radius:999px;font-weight:700;
    letter-spacing:.4px;text-transform:uppercase;flex:0 0 auto}
  @media(prefers-color-scheme:dark){.btag{color:#231f17}}
  :root[data-theme="dark"] .btag{color:#231f17}
  .tabs{display:flex;gap:6px;margin-top:12px;}
  .ltab{border:none;background:transparent;color:var(--ink-faint);font-size:var(--fs-sm);font-weight:600;padding:5px 12px;
    border-radius:999px;cursor:pointer;font-family:var(--sans);}
  .ltab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .archbtn{margin-left:8px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink-soft);
  border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.archbtn:hover{background:var(--surface-3);color:var(--ink)}
.archbtn:focus-visible,.cpy:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.archtag{margin-left:8px;border-radius:8px;padding:6px 11px;font-size:12px;
  background:var(--surface-3);color:var(--ink-faint);border:1px solid var(--line)}
.rows{flex:1;overflow-y:auto;padding:4px 10px 20px;}
  .grouplbl{font-size:var(--fs-xs);color:var(--ink-faint);padding:12px 8px 6px;font-weight:600;}
  .row{display:flex;gap:12px;align-items:center;padding:11px 10px;border-radius:11px;cursor:pointer;}
  .row:hover{background:var(--surface-2)}
  .row[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow)}
  .rav{width:40px;height:40px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:650;font-size:var(--fs-sm);letter-spacing:.3px;}
  .rmeta{flex:1;min-width:0}
  .rl1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .rn{font-weight:650;font-size:var(--fs-base);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .rt{font-size:var(--fs-xs);color:var(--ink-faint);white-space:nowrap;flex:0 0 auto}
  .rl2{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:var(--fs-sm);color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rl2 .mdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .unread{width:9px;height:9px;border-radius:50%;background:var(--rappel);flex:0 0 auto}
  .list-empty,.detail-empty{color:var(--ink-faint);text-align:center;padding:60px 24px;font-size:var(--fs-sm)}

  /* ---- right ---- */
  .det-head{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line);background:var(--surface);}
  .det-head .dav{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:650;font-size:var(--fs-sm);flex:0 0 auto}
  .det-head .dmeta{min-width:0}
  .det-head .dn{font-weight:700;font-size:var(--fs-lg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .det-head .dp{font-size:var(--fs-sm);color:var(--ink-faint);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
  .dback{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);
    border-radius:9px;font:inherit;font-size:19px;line-height:1;transition:transform 100ms ease-out}
  .dback:hover{background:var(--surface-3)}
  .dback:active{transform:scale(.96)}
  .dback:focus-visible,.burger:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .dback.mob,.burger{display:none}
  .det-head .archbtn,.det-head .archtag{margin-left:auto}
  .det-head .archtag+.archbtn{margin-left:0}
  .cpy{border:0;background:none;padding:2px;line-height:0;color:var(--ink-faint);cursor:pointer;
    opacity:0;transition:opacity .12s}
  .det-head .dp:hover .cpy,.cpy:focus-visible{opacity:1}
  /* tactile : pas de survol possible, l'icône reste visible en permanence */
  @media (hover:none){.cpy{opacity:1}}
  .cpy:hover{color:var(--ink)}
  .cpy.ok{opacity:1;color:var(--info)}
  .det-body{flex:1;overflow-y:auto;padding:22px 22px 10px;max-width:820px;width:100%;margin:0 auto;
    display:flex;flex-direction:column;}
  /* un fil court se pose en bas, comme une messagerie ; long, il defile normalement */
  .det-body>.tl{margin-top:auto}

  .beta{background:var(--inconnu-bg);border:1px solid var(--inconnu-line);border-radius:14px;padding:15px 18px;margin-bottom:20px;}
  .beta .bh{display:flex;align-items:center;gap:8px;color:var(--inconnu);font-weight:700;font-size:var(--fs-sm);margin-bottom:10px}
  .beta .btag{background:var(--inconnu);color:#fff;font-size:10px;padding:1px 7px;border-radius:999px;font-weight:700}
  @media(prefers-color-scheme:dark){.beta .btag{color:#231f17}}
  .beta ol{margin:0;padding-left:20px;color:var(--ink);font-size:var(--fs-sm);line-height:1.6}
  .beta li{margin-bottom:5px}

  .pill{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:600;padding:4px 11px;border-radius:999px}
  .pill.resa{background:var(--resa-bg);color:var(--resa);border:1px solid var(--resa-line)}
  .pill.info{background:var(--info-bg);color:var(--info);border:1px solid var(--info-line)}
  .pill.annulation{background:var(--annul-bg);color:var(--annul);border:1px solid var(--annul-line)}
  .pill.rappel{background:var(--rappel-bg);color:var(--rappel);border:1px solid var(--rappel-line)}
  .pill.inconnu{background:var(--inconnu-bg);color:var(--inconnu);border:1px solid var(--inconnu-line)}
  .pill.urgence{background:var(--urgence-bg);color:var(--urgence);border:1px solid var(--urgence-line)}

  /* ---- fil de discussion : appels (dépliables) + SMS, dans l'ordre chronologique ---- */
  .tl{display:flex;flex-direction:column;gap:10px;padding-bottom:6px}
  .tl-day{align-self:center;font-size:var(--fs-xs);color:var(--ink-faint);background:var(--surface-3);
    padding:3px 12px;border-radius:999px;margin:8px 0 2px}
  /* Un appel se lit comme un message recu : ancre a gauche, largeur de bulle.
     Deplie, il s'elargit pour laisser respirer infos/transcription — sans bouger
     son bord gauche, la carte grandit depuis son point d'ancrage. */
  /* Carte d'appel : un bouton qui pousse la vue detail. Plus d'accordeon —
     un appel deplie faisait plusieurs ecrans au milieu du fil. */
  .tl-call{align-self:flex-start;width:100%;max-width:78%;display:block;text-align:left;
    font:inherit;color:var(--ink);cursor:pointer;padding:0;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .tl-call:hover,.tl-call:active{background:var(--surface-2)}
  .tl-call:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .tlh{display:flex;align-items:center;gap:10px;width:100%;padding:12px 15px}
  .tlh .tld{font-size:var(--fs-sm);font-variant-numeric:tabular-nums;color:var(--ink-soft);flex:0 0 auto}
  .tlh .tlu{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-faint);font-variant-numeric:tabular-nums}
  .tlh .chev{color:var(--ink-faint);font-size:15px;flex:0 0 auto}

  .tl-sumh{display:block;padding:0 15px 5px;font-size:var(--fs-sm);font-weight:700;color:var(--ink)}
  .tl-sum{padding:0 15px 13px;font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.5}
  /* overflow:hidden coupe au bord de la boîte de padding : avec un padding-bas,
     la 3e ligne bavait dedans au lieu d'être coupée. En marge, la coupe tombe
     pile à la fin de la 2e ligne. */
  .tl-sum{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
    overflow:hidden;padding-bottom:0;margin-bottom:13px}

  // récent au plus ancien : la tête de groupe est donc le dernier appel.
  function groupsOf(list){
    var seen={},out=[];
    list.forEach(function(x){
      var k=groupKey(x);
      if(seen[k]){seen[k].items.push(x);return;}
      seen[k]={head:x,items:[x]};out.push(seen[k]);
    });
    return out;
  }
  // tous les appels du même correspondant, visibles ou non (pour le fil du détail)
  function historyFor(x){
    var k=groupKey(x);
    return data.filter(function(d){return groupKey(d)===k});
  }
  function visible(){
    return data.filter(function(x){
      if(filter!=='all'&&x.motif!==filter)return false;
      // une recherche active balaie tout, y compris les archivés
      if(!query){
        if(tab==='archives'){ if(!x.archived)return false; }
        else if(x.archived)return false;
        if(tab==='nonlus'&&!x.unread)return false;
      }
      return matchQuery(x);
    });
  }
  function renderRows(){
    var wrap=$('#rows'),grps=groupsOf(visible()),keep=wrap.scrollTop;
    if(!grps.length){wrap.innerHTML='<div class="list-empty">'+(query?'Aucun résultat.':tab==='archives'?'Aucune discussion archivée.':'Aucune discussion.')+'</div>';return;}
    var html='',lastGrp=null;
    grps.forEach(function(g){
      var x=g.head;
      if(x.grp!==lastGrp){html+='<div class="grouplbl">'+x.grp+'</div>';lastGrp=x.grp;}
      var isMasked=x.phone==='Numéro masqué';
      var sub=isMasked?'A raccroché · '+LABEL[x.motif]:LABEL[x.motif]+(x.dur?' · '+x.dur:'');
      if(g.items.length>1)sub+=' · '+g.items.length+' appels';
      var unread=g.items.some(function(i){return i.unread});
      var sel=g.items.some(function(i){return i.id===selected});
      html+='<div class="row" data-id="'+x.id+'"'+(sel?' aria-selected="true"':'')+'>'+
        '<div class="rav" style="background:'+COLOR[x.motif]+'">'+esc(initials(x.name))+'</div>'+
        '<div class="rmeta"><div class="rl1"><span class="rn">'+esc(x.name)+'</span><span class="rt">'+x.when+'</span></div>'+
        '<div class="rl2"><span class="mdot" style="background:'+COLOR[x.motif]+'"></span>'+esc(sub)+'</div></div>'+
        (unread?'<span class="unread"></span>':'')+'</div>';
    });
    wrap.innerHTML=html;wrap.scrollTop=keep;
    $$('.row',wrap).forEach(function(el){el.addEventListener('click',function(){openThread(el.dataset.id,true)});});
  }

  function betaFor(x){
    if(x.motif==='urgence')return ['Traiter en priorité la demande urgente de '+esc(x.name)+'.','Prévenir la maintenance ou le responsable de garde selon le motif signalé.'];
    if(x.motif==='resa')return ['Confirmer à la réception la réservation de '+esc(x.name)+(x.dates?' ('+esc(x.dates)+')':'')+'.','Vérifier la disponibilité et préparer la chambre pour une arrivée tardive.'];
    if(x.motif==='rappel')return ['Rappeler '+esc(x.name)+' au '+esc(x.phone)+' pour traiter sa demande.','Vérifier la réservation concernée avant de rappeler.'];
    if(x.motif==='annulation')return ['Confirmer l\'annulation par SMS à '+esc(x.name)+'.','Libérer la chambre concernée dans le planning.'];
    return null;
  }

  // Horodatage du fil. En live il vient de la base ; en démo on le reconstruit
  // depuis le libellé « 27/07 · 07h58 » (année courante, suffisant pour trier).
  function tsOf(x){
    if(x.ts)return x.ts;
    var m=/(\d{1,2})\/(\d{1,2})(?:\D+(\d{1,2})h(\d{2}))?/.exec(x.d||'');
    x.ts=m?new Date(new Date().getFullYear(),+m[2]-1,+m[1],+(m[3]||0),+(m[4]||0)).getTime():0;
    return x.ts;
  }
  // Un fil = un correspondant : ses appels ET ses SMS, du plus ancien au plus récent.
  function timelineFor(x){
    var items=historyFor(x).map(function(c){return {k:'call',ts:tsOf(c),c:c}})
      .concat(msgsFor(x).map(function(m){return {k:'sms',ts:m.ts||0,m:m}}));
    items.sort(function(a,b){return a.ts-b.ts});
    return items;
  }
  function callBodyHTML(x){
    var beta=betaFor(x),multi=x.attempts&&x.attempts.length>1;
    var info='<div class="di"><span class="k">Type de demande</span><span class="v">'+LABEL[x.motif]+'</span></div>';

    info+='<div class="di"><span class="k">Numéro</span><span class="v">'+esc(x.phone)+'</span></div>';
    info+='<div class="di"><span class="k">Durée</span><span class="v">'+(x.dur||'—')+'</span></div>';
    info+='<div class="di"><span class="k">Reçu</span><span class="v">'+esc(x.d)+'</span></div>';
    if(multi)info+='<div class="di"><span class="k">Appels répétés</span><span class="v" style="color:var(--inconnu)">'+x.attempts.length+'× — '+x.attempts.join(', ')+'</span></div>';
    // Les commandes qui exigent un vrai fichier (vitesse, téléchargement) ne
    // s'affichent que s'il y en a un : pas de bouton qui ne fait rien. Le
    // curseur, lui, reste visible mais desactive tant que la lecture n'a pas
    // charge cet enregistrement — play() l'active.
    var player=!x.noMessage?'<div class="player">'+
      '<div class="plh">Géré par votre Réceptionniste IA</div>'+

        '<button class="pp" aria-label="Lire l\'enregistrement">▶</button>'+

          'aria-label="Position dans l\'enregistrement">'+

      '</div></div>':'';
    var tr=(x.transcript&&x.transcript.length)
      ? '<div class="tr">'+x.transcript.map(function(m){return '<div class="b '+m.r+'"><div class="who">'+(m.r==='agent'?'Agent IA':'Client')+'</div>'+esc(m.x)+'</div>'}).join('')+'</div>'
      : '<div class="d-none">Aucun échange — l\'appelant a raccroché sans laisser de message.</div>';
    return '<div class="tl-body">'+
      '<div class="tl-sub">Enregistrement</div>'+(player||'<div class="d-none">Pas d\'enregistrement exploitable.</div>')+
      '<div class="tl-sub">Informations</div><div class="info-grid">'+info+'</div>'+
      '<div class="tl-sub">Transcription</div>'+tr+
      (beta?'<div class="beta" style="margin:20px 0 0"><div class="bh">✨ Avant votre prochain appel <span class="btag">Bêta</span></div><ol>'+
        beta.map(function(b){return '<li>'+b+'</li>'}).join('')+'</ol></div>':'')+
      '</div>';

  // Twilio renvoie ses statuts en anglais ; la reception lit du francais.
  var SMSST={queued:'en attente',accepted:'en attente',sending:'envoi en cours',
    sent:'envoyé',delivered:'reçu',read:'lu',undelivered:'non délivré',failed:'échec'};
  function threadHTML(x){
    var items=timelineFor(x);
    if(!items.length)return '<div class="d-none">Rien à afficher pour ce correspondant.</div>';
    return '<div class="tl">'+items.map(function(it){
      if(it.k==='sms'){
        var m=it.m;
        var out=m.direction!=='in';
        return '<div class="sms '+(out?'out':'in')+'">'+
               '<div class="smsh">'+(out?'SMS envoyé':'SMS reçu')+' · '+esc(m.at)+
               (out&&m.status?' · '+esc(SMSST[m.status]||m.status):'')+'</div>'+
               '<div class="m '+(out?'out':'in')+'">'+esc(m.body)+'</div></div>';
      }
      var c=it.c;
      // un <button> plutot qu'un <div> cliquable : atteignable au clavier
      return '<button class="tl-call" data-go="'+c.id+'">'+
        '<span class="tlh"><span class="tld">'+esc(c.d)+'</span>'+
        '<span class="pill '+c.motif+'">'+LABEL[c.motif]+'</span>'+
        '<span class="tlu">'+esc(c.noMessage?'sans message':(c.dur||''))+'</span>'+

        '<span class="tl-sumh">Résumé de l\'appel</span>'+
        '<span class="tl-sum">'+esc(c.summary)+'</span></button>';

  function callHeadHTML(c){

      '<div class="dmeta"><div class="dn">Appel du '+esc(c.d)+'</div>'+

  function durMS(d){if(!d)return '0:00';var m=/(\d+)\s*m\s*(\d+)/.exec(d);if(m)return m[1]+':'+('0'+m[2]).slice(-2);var s=/(\d+)\s*s/.exec(d);return s?'0:'+('0'+s[1]).slice(-2):'0:00';}

  function copyPhone(e){
    var b=e.currentTarget,ok=function(){
      b.classList.add('ok');b.title='Numéro copié';
      setTimeout(function(){b.classList.remove('ok');b.title='Copier le numéro'},1500);
    };
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(b.dataset.n||'').then(ok,function(){b.title='Copie impossible'});
    else b.title='Copie impossible';
  }
  function markRead(x){
    if(!x.unread)return;
    patchCall(x.id,{read_at:new Date().toISOString()});
    x.unread=false;
  }
  // Ouvrir une discussion depuis la liste. `byUser` est faux a l'ouverture
  // automatique : on n'a pas le droit de marquer « lu » ce que personne n'a lu.
  function openThread(id,byUser){
    var x=data.find(function(d){return d.id===id});if(!x)return;
    selected=id;openId=null;
    if(byUser)markRead(x);
    document.body.classList.add('detail');
    renderDetail();renderRows();renderCounts();
  }
  // Ouvrir un appel : une vue par-dessus le fil, avec retour.
  function openCall(id){
    var c=data.find(function(d){return d.id===id});if(!c)return;
    openId=id;markRead(c);
    renderDetail();renderRows();renderCounts();
  }
  function renderDetail(){
    var x=data.find(function(d){return d.id===selected});if(!x)return;
    var c=openId?data.find(function(d){return d.id===openId}):null;
    $('#detailEmpty').style.display='none';$('#detailInner').style.display='flex';
    $('#detHead').innerHTML=c?callHeadHTML(c):detHeadHTML(x);
    var body=$('#detBody');body.innerHTML=c?callViewHTML(c):threadHTML(x);
    // une vue poussee s'ouvre en haut ; un fil s'ouvre sur son dernier message
    body.scrollTop=c?0:body.scrollHeight;
    $('#composer').style.display=c?'none':'';
    var cp=$('#detHead .cpy');
    if(cp)cp.addEventListener('click',copyPhone);
    var bt=$('#dbackThread');
    if(bt)bt.addEventListener('click',function(){openId=null;renderDetail();renderRows();});
    var bl=$('#dbackList');
    if(bl)bl.addEventListener('click',function(){document.body.classList.remove('detail')});

    if(!c){
      $$('#detBody .tl-call').forEach(function(el){
        el.addEventListener('click',function(){openCall(el.dataset.go)});
      });
      return bindArchive(x);
    }
    var pp=$('#detBody .player .pp');
    if(pp)pp.addEventListener('click',function(){
      if(c.audio)play($('#detBody .player'),c.audio);else simPlay($('#detBody .player'));
    });
    var sp=$('#detBody .spd');
    if(sp)sp.addEventListener('click',function(){
      rate=RATES[(RATES.indexOf(rate)+1)%RATES.length];
      sp.textContent=rateLabel();
      if(au)au.playbackRate=rate;
    });
    // `au` est partagé entre les appels : on ne pilote que si c'est bien
    // l'enregistrement affiché qui est chargé, sinon on déplacerait un autre appel.
    // Le curseur n'est actif qu'une fois cet enregistrement chargé, donc pas de
    // garde silencieuse ici : ce qui est cliquable fait quelque chose.
    var tk=$('#detBody .player .track');
    if(tk)tk.addEventListener('input',function(){
      if(au&&au.duration)au.currentTime=tk.value/1000*au.duration;
    });
    var dl=$('#detBody .player .dl');
    if(dl)dl.addEventListener('click',function(e){
      e.preventDefault();
      var url=dl.getAttribute('href');
      dl.classList.add('busy');
      fetch(url).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){
        var u=URL.createObjectURL(b),a=document.createElement('a');
        a.href=u;a.download='appel-'+String(c.d||'').replace(/[^0-9]+/g,'-').replace(/^-|-$/g,'')+'.mp3';
        document.body.appendChild(a);a.click();a.remove();
        setTimeout(function(){URL.revokeObjectURL(u)},1000);
      }).catch(function(){
        // hote sans CORS : on retombe sur l'ouverture, au moins le fichier est joignable
        window.open(url,'_blank','noopener');
      }).then(function(){dl.classList.remove('busy')});
    });
  }
  function bindArchive(x){
    var ab=$('#archBtn');
    if(ab)ab.addEventListener('click',function(){
      // Archiver est réversible : la ligne reste, `archived_at` repasse à null.
      // Un bouton qui fait l'aller-retour vaut mieux qu'un confirm() qui annonce
      // du définitif ; le meme bouton sert d'annulation, sans fenêtre de quelques
      // secondes à rater.
      var on=!x.archived;
      x.archived=on;
      x.archivedAt=on?new Date().toLocaleDateString('fr-FR'):'';
      patchCall(x.id,{archived_at:on?new Date().toISOString():null});
      renderDetail();renderRows();renderCounts();
    });
  }
  // Lecture réelle : l'URL pointe le proxy N8N qui rejoue l'audio ElevenLabs.
  var au=null,rate=1;
  var RATES=[1,1.5,2];
  function rateLabel(){return String(rate).replace('.',',')+'×';}
  function mmss(t){t=Math.floor(t||0);return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2);}
  function play(pl,url){
    if(!pl)return;
    var tk=$('.track',pl),pp=$('.pp',pl),lbl=$('.dur',pl);
    if(au&&au.src===url){if(au.paused){au.play();pp.textContent='❚❚';}else{au.pause();pp.textContent='▶';}return;}
    if(au)au.pause();
    au=new Audio(url);au.playbackRate=rate;pp.textContent='…';
    au.addEventListener('timeupdate',function(){
      // Pendant un glissement, 'input' vient deja de poser currentTime : on
      // reecrit la meme position, le pouce ne saute pas.
      if(au.duration)tk.value=au.currentTime/au.duration*1000;
      lbl.textContent=mmss(au.currentTime)+' / '+mmss(au.duration);
    });
    au.addEventListener('loadedmetadata',function(){tk.disabled=false});
    au.addEventListener('playing',function(){pp.textContent='❚❚'});
    au.addEventListener('ended',function(){pp.textContent='▶';tk.value=0;});
    au.addEventListener('error',function(){pp.textContent='▶';lbl.textContent='indisponible'});
    au.play().catch(function(){pp.textContent='▶';lbl.textContent='indisponible'});
  }
  // ponytail: maquette pour les appels sans fichier audio. Le curseur reste
  // desactive — il n'y a rien a parcourir.
  function simPlay(pl){if(!pl)return;var tk=$('.track',pl),pp=$('.pp',pl);pp.textContent='❚❚';var w=0;
    var iv=setInterval(function(){w+=20;tk.value=Math.min(1000,w);if(w>=1000){clearInterval(iv);pp.textContent='▶';tk.value=0;}},70);}


  // Une erreur dans la petite ligne grise du composeur passe inapercue.
  // Reutilise .modal/.sheet de l'administration : rien de nouveau a styler.
  function alertBox(titre,texte){
    var ov=$('#alertOv');
    ov.innerHTML='<div class="sheet" role="alertdialog" aria-modal="true">'+
      '<div class="sh"><h2 class="bad">'+esc(titre)+'</h2>'+
        '<button class="x" id="alX" aria-label="Fermer">×</button></div>'+
      '<p class="lead">'+esc(texte)+'</p>'+
      '<button class="go" id="alOk">J\'ai compris</button></div>';
    ov.hidden=false;
    function close(){ov.hidden=true;document.removeEventListener('keydown',onKey);}
    function onKey(e){if(e.key==='Escape')close();}
    $('#alX').addEventListener('click',close);
    $('#alOk').addEventListener('click',close);
    ov.addEventListener('click',function(e){if(e.target===ov)close();});
    document.addEventListener('keydown',onKey);
    $('#alOk').focus();
  }

  // ---------------- administration ----------------
  // Reservee au compte plateforme. L'app etant du JS public, elle ne cree rien
  // elle-meme : elle appelle la fonction `admin`, seule detentrice de la cle de
  // service, qui revalide le jeton avant d'agir.
  function jwtPayload(t){
    try{
      var p=String(t||'').split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      return JSON.parse(atob(p+(p.length%4?'===='.slice(p.length%4):'')))||{};
    }catch(e){return {}}
  }
  function isAdmin(){
    var m=jwtPayload(tok).app_metadata;
    return !!(m&&m.mylidie_admin===true);
  }
  function refreshAdmin(){var b=$('#adminBtn');if(b)b.hidden=!isAdmin();}
  function adminCall(payload){
    return fetch(SUPA.url+'/functions/v1/admin',{method:'POST',
      headers:{apikey:SUPA.anon,Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify(payload)})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
        if(!r.ok)throw new Error(j.error||'Erreur inattendue.');return j;})});
  }

  function loadHotelOptions(pick){
    return api('/rest/v1/hotels?select=id,name&order=name.asc')
      .then(function(r){return r.json()})
      .then(function(rows){
        var sel=$('#ivHotel');if(!sel)return;
        sel.innerHTML=(rows||[]).map(function(h){
          return '<option value="'+esc(h.id)+'">'+esc(h.name)+'</option>';
        }).join('')||'<option value="">Aucun établissement</option>';
        if(pick)sel.value=pick;
      }).catch(function(){});
  }
  function setNote(el,txt,ok){
    el.textContent=txt;el.className='note'+(txt?(ok?' ok':' err'):'');
  }
  function openAdmin(){
    var ov=$('#adminOv');
    ov.innerHTML=adminHTML();ov.hidden=false;
    loadHotelOptions();
    $('#admX').addEventListener('click',function(){ov.hidden=true});
    ov.addEventListener('click',function(e){if(e.target===ov)ov.hidden=true});

    $('#nhGo').addEventListener('click',function(){
      var b=this,note=$('#nhNote');
      setNote(note,'Création…');b.disabled=true;
      adminCall({action:'create_hotel',
        name:$('#nhName').value,slug:$('#nhSlug').value,
        phone_e164:$('#nhPhone').value,emergency_e164:$('#nhUrg').value,
        el_agent_id:$('#nhAgent').value,sms_sender_id:$('#nhSender').value,
        recap_emails:$('#nhMails').value})
      .then(function(j){
        setNote(note,'✓ « '+(j.hotel&&j.hotel.name||'')+' » créé. Invitez maintenant quelqu\'un ci-dessous.',true);
        ['nhName','nhSlug','nhPhone','nhUrg','nhAgent','nhSender','nhMails'].forEach(function(i){$('#'+i).value=''});
        return loadHotelOptions(j.hotel&&j.hotel.id);
      })
      .catch(function(e){setNote(note,e.message)})
      .then(function(){b.disabled=false});
    });

    $('#ivGo').addEventListener('click',function(){
      var b=this,note=$('#ivNote'),sel=$('#ivHotel'),lk=$('#ivLink');
      if(!sel.value){setNote(note,'Créez d\'abord un établissement.');return;}
      setNote(note,'Envoi…');b.disabled=true;lk.hidden=true;
      adminCall({action:'invite',email:$('#ivMail').value,
        hotel_id:sel.value,role:$('#ivRole').value})
      .then(function(j){
        setNote(note,(j.invited
          ? '✓ Invitation envoyée. La personne choisit son mot de passe depuis l\'e-mail.'
          : '✓ Ce compte existait déjà : il est maintenant rattaché à cet établissement.')+
          (j.link?' Si l\'e-mail n\'arrive pas, transmettez ce lien (valable 1 h) :':''),true);
        if(j.link){lk.value=j.link;lk.hidden=false;}
        $('#ivMail').value='';
      })
      .catch(function(e){setNote(note,e.message)})
      .then(function(){b.disabled=false});
    });

    // un lien de 300 caractères ne se sélectionne pas au doigt : un tap suffit
    $('#ivLink').addEventListener('click',function(){this.select()});
  }

  // --------- mode live : login, chargement, écriture ---------
  function fmtPhone(p){
    if(!p)return 'Numéro masqué';
    var m=/^\+33(\d)(\d{2})(\d{2})(\d{2})(\d{2})$/.exec(p);
    return m?'+33 '+m[1]+' '+m[2]+' '+m[3]+' '+m[4]+' '+m[5]:p;
  }
  function fmtDur(sec){sec=sec||0;return sec>=60?Math.floor(sec/60)+' m '+(sec%60)+' s':sec+' s';}
  function mapRow(r){
    var d=new Date(r.started_at),now=new Date();
    var jour=d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
    var heure=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}).replace(':','h');
    var ecoule=(now-d)/86400000;
    var ex=r.extracted||{},gv=function(k){return (ex[k]&&ex[k].value)?String(ex[k].value):''};
    var tr=(r.transcript||[]).filter(function(t){return t.message})
      .map(function(t){return {r:t.role==='agent'?'agent':'client',x:t.message}});
    return {id:r.id,motif:r.motif||'inconnu',
      name:gv('nom_client')||'Appelant non identifié',
      phone:fmtPhone(r.from_e164),
      grp:ecoule<7?'Cette semaine':'Plus ancien',
      when:ecoule<1?heure:(ecoule<7?d.toLocaleDateString('fr-FR',{weekday:'short'}):jour),
      d:jour+' · '+heure,
      unread:!r.read_at,archived:!!r.archived_at,
      archivedAt:r.archived_at?new Date(r.archived_at).toLocaleDateString('fr-FR'):'',
      dur:fmtDur(r.duration_secs),summary:r.summary||'(pas de résumé)',
      transcript:tr,noMessage:tr.length===0,audio:r.recording_url||'',
      dates:gv('dates_sejour'),resa:gv('reservation_prise')};
  }
  function loadHotel(){
    return api('/rest/v1/hotels?select=name,logo_url,phone_e164&limit=1')
      .then(function(r){return r.json()}).then(function(h){
        if(!h||!h.length)return;
        hotel=h[0];
        $('.brandbox .hn').textContent=hotel.name||'';
        if(hotel.phone_e164)$('.brandbox .hp span:last-child').textContent=fmtPhone(hotel.phone_e164);
        if(hotel.logo_url)$('.brandbox .logo').innerHTML='<img src="'+hotel.logo_url+'" alt="">';
      }).catch(function(){});
  }
  function loadMsgs(){
    return api('/rest/v1/messages?select=*&order=created_at.asc&limit=500')
      .then(function(r){return r.json()})
      .then(function(rows){
        msgs=(rows||[]).map(function(m){
          // Sans ts, timelineFor() retombait sur 0 et collait tous les SMS en
          // haut du fil, avant des appels bien plus anciens.
          return {direction:m.direction,body:m.body,status:m.status,phone_e164:m.phone_e164||'',
                  ts:new Date(m.created_at).getTime(),
                  at:new Date(m.created_at).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',
                       hour:'2-digit',minute:'2-digit'}).replace(':','h').replace(', ',' à ')};
        });
      }).catch(function(){msgs=[]});
  }
  function loadCalls(){
    return api('/rest/v1/calls?select=*&order=started_at.desc&limit=200')
      .then(function(r){if(r.status===401){logout();throw new Error('session expirée');}return r.json()})
      .then(function(rows){
        refreshAdmin();
        data.length=0;rows.forEach(function(r){data.push(mapRow(r))});
        return Promise.all([loadHotel(),loadMsgs()]).then(function(){
          renderCounts();renderRows();
          var v=visible();
          if(v.length&&window.matchMedia('(min-width:901px)').matches)openThread(v[0].id);
        });
      });
  }
  function logout(){try{localStorage.removeItem('mylidie_tok')}catch(e){}tok=null;showLogin();}
  // Un seul ecran, trois modes : connexion, mot de passe oublie, choix du mot
  // de passe (arrivee depuis le lien recu par mail — invitation ou reinitialisation).
  var AUTH_LOGO='/mylidie-logo.png',lastMail='';
  var AUTH={
    login:{h:'Réception Mylidie',
      sub:'Connectez-vous pour voir les appels de votre établissement.',
      btn:'Se connecter',
      fields:'<input id="aMail" type="email" required placeholder="Adresse e-mail" autocomplete="username">'+
             '<input id="aPass" type="password" required placeholder="Mot de passe" autocomplete="current-password">',
      links:'<button type="button" class="link" data-go="forgot">Mot de passe oublié ?</button>'},
    forgot:{h:'Mot de passe oublié',
      sub:'Indiquez votre adresse e-mail : vous recevrez un lien pour choisir un nouveau mot de passe.',
      btn:'Envoyer le lien',
      fields:'<input id="aMail" type="email" required placeholder="Adresse e-mail" autocomplete="username">',
      links:'<button type="button" class="link" data-go="login">Retour à la connexion</button>'},
    newpass:{h:'Choisissez votre mot de passe',
      sub:'Au moins 8 caractères. Il vous servira à chaque connexion.',
      btn:'Enregistrer et entrer',
      fields:'<input id="aPass" type="password" required minlength="8" placeholder="Nouveau mot de passe" autocomplete="new-password">',
      links:''}
  };
  function authScreen(mode,msg,good){
    var el=document.getElementById('loginOv');
    if(!el){el=document.createElement('div');el.id='loginOv';document.body.appendChild(el);}
    el.style.display='flex';
    var f=AUTH[mode];
    el.innerHTML='<form class="authbox" id="authF" novalidate>'+
      '<img class="authlogo" src="'+AUTH_LOGO+'" alt="Mylidie">'+
      '<h1>'+f.h+'</h1><div class="sub">'+f.sub+'</div>'+f.fields+
      '<button type="submit" class="main">'+f.btn+'</button>'+
      '<p class="authmsg '+(good?'ok':'err')+'" id="aMsg">'+esc(msg||'')+'</p>'+f.links+'</form>';
    var mi=document.getElementById('aMail');
    if(mi){if(lastMail)mi.value=lastMail;mi.focus();}
    else{var pi=document.getElementById('aPass');if(pi)pi.focus();}
    $$('#loginOv .link').forEach(function(b){
      b.addEventListener('click',function(){authScreen(b.dataset.go)});
    });
    document.getElementById('authF').addEventListener('submit',function(e){
      e.preventDefault();submitAuth(mode);
    });
  }
  function hideAuth(){var el=document.getElementById('loginOv');if(el)el.remove();}
  function showLogin(msg){authScreen('login',msg);}
  function submitAuth(mode){
    var msg=document.getElementById('aMsg'),
        mail=document.getElementById('aMail'),
        pass=document.getElementById('aPass');
    if(mail)lastMail=mail.value.trim();
    if(mail&&!lastMail){authScreen(mode,'Indiquez votre adresse e-mail.');return;}
    msg.className='authmsg';

    if(mode==='login'){
      if(!pass.value){authScreen('login','Indiquez votre mot de passe.');return;}
      msg.textContent='Connexion…';
      fetch(SUPA.url+'/auth/v1/token?grant_type=password',{method:'POST',
        headers:{apikey:SUPA.anon,'Content-Type':'application/json'},
        body:JSON.stringify({email:lastMail,password:pass.value})})
      .then(function(r){return r.json()})
      .then(function(j){
        if(!j.access_token){authScreen('login','Identifiants incorrects.');return;}
        tok=j.access_token;try{localStorage.setItem('mylidie_tok',tok)}catch(e){}
        hideAuth();loadCalls();
      }).catch(function(){authScreen('login','Connexion impossible.')});
      return;
    }

    if(mode==='forgot'){
      msg.textContent='Envoi…';
      // Meme reponse quoi qu'il arrive : annoncer « adresse inconnue »
      // revelerait qui possede un compte.
      fetch(SUPA.url+'/auth/v1/recover',{method:'POST',
        headers:{apikey:SUPA.anon,'Content-Type':'application/json'},
        body:JSON.stringify({email:lastMail,redirect_to:location.origin+location.pathname})})
      .then(function(){authScreen('forgot',
        'Si un compte existe pour cette adresse, le lien vient de partir. Pensez à regarder les indésirables.',true)})
      .catch(function(){authScreen('forgot','Envoi impossible, réessayez dans un instant.')});
      return;
    }

    // newpass : `tok` vient du lien recu par mail, pas d'une saisie
    if(pass.value.length<8){authScreen('newpass','Le mot de passe doit faire au moins 8 caractères.');return;}
    msg.textContent='Enregistrement…';
    fetch(SUPA.url+'/auth/v1/user',{method:'PUT',
      headers:{apikey:SUPA.anon,Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({password:pass.value})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(res){
      if(!res.ok){
        authScreen('newpass',res.j.msg||res.j.error_description||
          'Ce lien a expiré. Demandez-en un nouveau depuis « Mot de passe oublié ».');
        return;
      }
      try{localStorage.setItem('mylidie_tok',tok)}catch(e){}
      hideAuth();loadCalls();
    }).catch(function(){authScreen('newpass','Enregistrement impossible.')});
  }
  function hashParams(){
    var o={},h=(location.hash||'').replace(/^#/,'');
    h.split('&').forEach(function(kv){var i=kv.indexOf('=');
      if(i>0)o[decodeURIComponent(kv.slice(0,i))]=decodeURIComponent(kv.slice(i+1));});
    return o;
  }
  function patchCall(id,body){
    if(!LIVE)return;
    api('/rest/v1/calls?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},
      body:JSON.stringify(body)}).catch(function(){});
  }

  // Le menu ne s'ouvrait jamais : la déconnexion et le thème étaient injoignables.
  var uBtn=$('#userBtn'),uMenu=$('#userMenu');
  function openMenu(on){uMenu.hidden=!on;uBtn.setAttribute('aria-expanded',on?'true':'false');}
  uBtn.addEventListener('click',function(e){e.stopPropagation();openMenu(uMenu.hidden);});
  document.addEventListener('click',function(e){if(!e.target.closest('.usermenu'))openMenu(false);});
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    var ov=$('#adminOv');
    if(ov&&!ov.hidden){ov.hidden=true;return;}
    openMenu(false);
    if(document.body.classList.contains('drawer'))drawer(false);
    else if(openId){openId=null;renderDetail();renderRows();}
    else document.body.classList.remove('detail');
  });
  // en démo il n'y a pas de session à fermer : pas de bouton mort
  $('#adminBtn').addEventListener('click',function(){openMenu(false);openAdmin();});
  if(LIVE)$('#logoutBtn').addEventListener('click',function(){openMenu(false);logout();});
  else $('#logoutBtn').remove();

  function drawer(on){document.body.classList.toggle('drawer',on);}
  $('#burger').addEventListener('click',function(e){e.stopPropagation();drawer(!document.body.classList.contains('drawer'));});
  $('#scrim').addEventListener('click',function(){drawer(false)});

  $('#nav').addEventListener('click',function(e){var b=e.target.closest('.navitem');if(!b)return;
    filter=b.dataset.f;$$('.navitem').forEach(function(x){x.setAttribute('aria-current',x===b?'true':'false')});
    drawer(false);renderRows();});
  $('#tabs').addEventListener('click',function(e){var b=e.target.closest('.ltab');if(!b)return;
    tab=b.dataset.t;$$('.ltab').forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false')});renderRows();renderCounts();});
  $('#search').addEventListener('input',function(){query=this.value.trim();renderRows();renderCounts();});

  var SMS_OUT='https://n8n-5tkb.srv1203069.hstgr.cloud/webhook/mylidie-sms-out';
  // Au retour de l'envoi le SMS est encore "en attente" : Twilio ne fait que
  // l'accepter. La livraison arrive 1 a 10 s plus tard par le callback, et
  // rien ne rechargeait le fil — le statut restait fige. On recharge 3 fois.
  function refreshStatuses(n){
    if(n<=0)return;
    setTimeout(function(){
      loadMsgs().then(function(){if(selected)renderDetail();refreshStatuses(n-1);});
    },4000);
  }
  function sendMsg(){
    var inp=$('#cInput'),v=inp.value.trim();if(!v)return;
    var note=$('.composer .cnote'),old='Envoyer un sms';
    var x=data.find(function(d){return d.id===selected});
    if(!LIVE){inp.value='';inp.style.height='auto';
      note.textContent='✓ Message envoyé';setTimeout(function(){note.textContent=old},2000);return;}
    function fail(txt){
      note.textContent=txt;note.classList.add('err');
      setTimeout(function(){note.textContent=old;note.classList.remove('err');},4000);
    }
    if(!x||digits(x.phone).length<6){fail('Numéro inconnu, envoi impossible.');return;}
    // En France seuls les 06/07 recoivent des SMS ; Twilio rejette les fixes
    // (01-05, 09) avec « cannot be a landline ». Autant le dire tout de suite.
    var dg=digits(x.phone);
    if(dg.indexOf('33')===0&&!/^33[67]/.test(dg)){
      alertBox('Ligne fixe',
        'Le '+x.phone+' est une ligne fixe : elle ne peut pas recevoir de SMS. '+
        'Seuls les numéros mobiles (06 et 07) en reçoivent. Rappelez ce client par téléphone.');
      return;}
    inp.value='';inp.style.height='auto';note.textContent='Envoi…';
    // le webhook N8N revalide le jeton auprès de Supabase avant de faire partir le SMS
    fetch(SMS_OUT,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},
      body:JSON.stringify({to:'+'+digits(x.phone),body:v})})
      .then(function(r){if(!r.ok)throw new Error();return r.json()})
      .then(function(){note.textContent='✓ SMS envoyé';
        return loadMsgs().then(function(){if(selected)renderDetail();refreshStatuses(3);});})
      .catch(function(){fail('Échec de l\'envoi.');inp.value=v;})
      .then(function(){setTimeout(function(){note.textContent=old;note.classList.remove('err');},3000)});
  }
  $('#cSend').addEventListener('click',sendMsg);
  $('#cInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(120,this.scrollHeight)+'px'});
  $('#cInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});

  if(LIVE){
    data.length=0;
    var hp=hashParams();
    renderCounts();renderRows();
    if((hp.type==='recovery'||hp.type==='invite')&&hp.access_token){
      // On sort le jeton de la barre d'adresse avant toute chose : il ne doit
      // pas rester dans l'historique ni partir dans un referer.
      tok=hp.access_token;
      try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
      authScreen('newpass');
    }else{
      try{tok=localStorage.getItem('mylidie_tok')}catch(e){}
      if(tok)loadCalls().catch(function(){});else showLogin();
    }
  }else{
    renderCounts();renderRows();
    if(window.matchMedia('(min-width:901px)').matches)openThread('c2');
  }
})();
</script>
