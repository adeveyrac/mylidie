<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mylidie Administration</title>
<link rel="icon" href="/favicon.svg">
</head>
<body>
<style>
  /* Tokens repris tels quels de mylidie-desktop.html : la console doit se sentir
     comme la meme application, pas comme un outil a part. */
  :root{
    --bg:#eceae2; --surface:#ffffff; --surface-2:#f5f3ec; --surface-3:#efece2;
    --ink:#24231c; --ink-soft:#5c5a4e; --ink-faint:#928f80;
    --line:#e6e2d6; --line-strong:#d8d3c4;
    --brand:#3a3a28; --brand-2:#4d4c36; --btn-bg:#3a3a28; --btn-fg:#fff;
    --resa:#c0392b; --resa-bg:#fbeae7;
    --info:#2f7d5b; --info-bg:#e7f2ec;
    --annulation:#5b6b7a; --annulation-bg:#eef1f4;
    --rappel:#b5850f; --rappel-bg:#fbf1d8;
    --inconnu:#6d4b9f; --inconnu-bg:#efe9f6;
    --urgence:#d9480f; --urgence-bg:#fdece3;
    --shadow:0 1px 2px rgba(40,38,28,.05),0 6px 18px rgba(40,38,28,.06);
    --fs-xs:11px; --fs-sm:13px; --fs-base:14px; --fs-lg:16px; --fs-xl:19px; --fs-2xl:24px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,ui-serif,serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#131209; --surface:#201e18; --surface-2:#29271f; --surface-3:#2f2c22;
    --ink:#f2efe5; --ink-soft:#bcb8a8; --ink-faint:#867f6d; --line:#322f25; --line-strong:#3d3a2e;
    --brand:#cdbb8e; --brand-2:#d8c89e; --btn-bg:#cbb98d; --btn-fg:#231f17;
    --resa:#e8776b; --resa-bg:#38211d; --info:#5cbd90; --info-bg:#15332a;
    --annulation:#9fb0bf; --annulation-bg:#232a30; --rappel:#e5bd52; --rappel-bg:#332a14;
    --inconnu:#b79ae0; --inconnu-bg:#2c2338; --urgence:#f0885c; --urgence-bg:#3a2116;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  }}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:var(--fs-base);
    -webkit-font-smoothing:antialiased;}
  button{font-family:inherit}

  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);height:100dvh;}
  .side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .main{overflow-y:auto;min-width:0}

  /* ---- colonne gauche ---- */
  .brandbox{padding:16px;border-bottom:1px solid var(--line);display:flex;gap:11px;align-items:center;}
  .logo{width:38px;height:38px;border-radius:11px;background:var(--brand);color:#f5f3ea;display:grid;
    place-items:center;font-family:var(--serif);font-style:italic;font-size:19px;flex:0 0 auto}
  .brandbox .hn{font-weight:700;letter-spacing:-.2px;display:block}
  .brandbox .hs{font-size:var(--fs-xs);color:var(--ink-faint);display:block;margin-top:2px}
  .navlbl{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);
    padding:16px 18px 6px;}
  .nav{padding:0 10px;display:flex;flex-direction:column;gap:2px}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;border:none;
    background:transparent;color:var(--ink-soft);font-size:var(--fs-sm);cursor:pointer;text-align:left;width:100%;
    transition:transform 100ms ease-out}
  .navitem:hover{background:var(--surface-2)}
  .navitem:active{transform:scale(.985);background:var(--surface-3)}
  .navitem[aria-current="true"]{background:var(--surface-3);color:var(--ink);font-weight:600}
  .navitem .cnt{margin-left:auto;font-size:var(--fs-xs);color:var(--ink-faint);background:var(--surface-3);
    padding:1px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
  .navitem[aria-current="true"] .cnt{background:var(--surface)}
  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;font-size:var(--fs-xs);
    color:var(--ink-faint);line-height:1.5}
  .side-foot a{color:var(--ink-soft)}

  /* ---- contenu ---- */
  .head{padding:22px 26px 16px;border-bottom:1px solid var(--line);background:var(--surface);
    position:sticky;top:0;z-index:5}
  .head h1{font-size:var(--fs-2xl);margin:0;letter-spacing:-.4px}
  .head p{margin:6px 0 0;font-size:var(--fs-sm);color:var(--ink-soft);max-width:70ch;line-height:1.5}
  .body{padding:22px 26px 60px;max-width:1150px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    margin-bottom:18px;overflow:hidden}
  .card > h2{font-size:var(--fs-base);margin:0;padding:14px 18px;border-bottom:1px solid var(--line);
    letter-spacing:-.1px;display:flex;align-items:center;gap:10px}
  .card > h2 .sub{font-weight:400;font-size:var(--fs-xs);color:var(--ink-faint);margin-left:auto}
  .gear{border:0;background:none;color:var(--ink-faint);cursor:pointer;padding:4px 7px;border-radius:8px;
    font-size:15px;line-height:1}
  .gear:hover{background:var(--surface-2);color:var(--ink)}
  .gear:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .card .in{padding:16px 18px}
  .scrollx{overflow-x:auto}

  table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
  th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.5px;
    color:var(--ink-faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--surface-2)}
  .num{font-variant-numeric:tabular-nums}
  .right{text-align:right}
  .hname{font-weight:600}
  .hsub{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:2px}

  .tag{display:inline-block;font-size:var(--fs-xs);padding:2px 9px;border-radius:999px;font-weight:600}
  .t-payant{background:var(--info-bg);color:var(--info)}
  .t-test{background:var(--rappel-bg);color:var(--rappel)}
  .t-inactif{background:var(--annulation-bg);color:var(--annulation)}

  .btn{border:1px solid var(--line-strong);background:var(--surface-2);color:var(--ink);border-radius:9px;
    padding:7px 12px;font-size:var(--fs-sm);cursor:pointer;transition:transform 100ms ease-out}
  .btn:hover{background:var(--surface-3)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:transparent;font-weight:600}
  .btn.primary:hover{background:var(--brand-2)}
  .btn[disabled]{opacity:.55;cursor:default;transform:none}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .btn.sm{padding:5px 10px;font-size:var(--fs-xs)}

  /* ---- barre de filtres ---- */
  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:18px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:var(--fs-xs);color:var(--ink-soft)}
  .fld input,.fld select{padding:8px 11px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--surface);color:var(--ink);font:inherit;font-size:var(--fs-sm)}
  .fld input:focus,.fld select:focus{outline:2px solid color-mix(in srgb,var(--brand) 35%,transparent);outline-offset:1px}
  .seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;background:var(--surface)}
  .seg button{border:0;background:none;color:var(--ink-soft);font-size:var(--fs-sm);padding:8px 13px;cursor:pointer;
    border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink);font-weight:600}
  .seg button:active{background:var(--surface-2)}

  /* ---- KPI ---- */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow)}
  .kpi .k{font-size:var(--fs-xs);color:var(--ink-faint);text-transform:uppercase;letter-spacing:.5px}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:-.8px;margin-top:6px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:3px;line-height:1.45}
  .kpi .d.up{color:var(--info)} .kpi .d.down{color:var(--resa)}
  .kpi.marge .v{color:var(--info)}
  .kpi.marge.neg .v{color:var(--resa)}

  /* ---- graphiques ---- */
  .chart{display:flex;align-items:flex-end;gap:3px;height:150px;padding:0 2px}
  .chart .b{flex:1;min-width:3px;background:var(--brand);opacity:.75;border-radius:3px 3px 0 0;min-height:2px;
    position:relative}
  .chart .b:hover{opacity:1}
  .chart .b span{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);font-size:var(--fs-xs);padding:3px 7px;border-radius:6px;
    white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 120ms}
  .chart .b:hover span{opacity:1}
  .xaxis{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--ink-faint);
    margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}

  .mrow{display:flex;align-items:center;gap:12px;margin-bottom:11px}
  .mrow .ml{width:150px;font-size:var(--fs-sm);flex:0 0 auto;display:flex;align-items:center;gap:8px}
  .mrow .md{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
  .mrow .mb{flex:1;height:9px;background:var(--surface-3);border-radius:999px;overflow:hidden}
  .mrow .mb i{display:block;height:100%;border-radius:999px}
  .mrow .mv{width:88px;text-align:right;font-size:var(--fs-sm);color:var(--ink-soft);font-variant-numeric:tabular-nums;flex:0 0 auto}

  /* ---- couts ---- */
  .cout td{padding:10px 14px}
  .cout .lbl b{display:block}
  .cout .calc{font-size:var(--fs-xs);color:var(--ink-faint);margin-top:2px}
  .cout tr.tot td{border-top:2px solid var(--line-strong);font-weight:700;background:var(--surface-2)}
  .cout tr.rev td{color:var(--ink-soft)}
  .cout tr.marge td{border-top:2px solid var(--line-strong);font-weight:700;font-size:var(--fs-base)}

  /* ---- exports ---- */
  .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
  .chk{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;
    background:var(--surface-2);cursor:pointer;font-size:var(--fs-sm)}
  .chk:hover{border-color:var(--line-strong)}
  .chk input{accent-color:var(--brand);width:16px;height:16px;flex:0 0 auto}
  .chk .cs{font-size:var(--fs-xs);color:var(--ink-faint);margin-left:auto;font-variant-numeric:tabular-nums}
  .chk .hsub{display:block;margin-top:2px}
  .recap{background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:11px;padding:13px 15px;
    font-size:var(--fs-sm);color:var(--ink-soft);line-height:1.6;margin-top:16px}
  .recap b{color:var(--ink)}

  /* ---- formulaire ---- */
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .fw{margin-bottom:12px}
  .fw label{display:block;font-size:var(--fs-xs);color:var(--ink-soft);margin-bottom:4px}
  .fw input,.fw select{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--surface-2);color:var(--ink);font:inherit;font-size:var(--fs-sm)}
  .fw .hint{display:block;font-size:var(--fs-xs);color:var(--ink-faint);margin-top:4px;line-height:1.45}
  /* Témoins de câblage. Le vert/rouge n'est jamais seul porteur du sens :
     chaque ligne est doublée d'un texte, et d'un libellé lu par les lecteurs
     d'écran — un daltonien doit lire la même chose que les autres. */
  .cabl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .cabl li{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line)}
  .cabl li:first-child{border-top:0}
  .cabl .dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:0 0 auto}
  .cabl li.on .dot{background:var(--info)} .cabl li.off .dot{background:var(--resa)}
  .cabl li>span:nth-child(2){flex:1;min-width:0}
  .cabl li>span:nth-child(2) b{display:block;font-size:var(--fs-sm)}
  .cabl li>span:nth-child(2) .hsub{display:block;word-break:break-word}
  .cabl .sr{font-size:var(--fs-xs);font-weight:600;white-space:nowrap;align-self:center}
  .cabl li.on .sr{color:var(--info)} .cabl li.off .sr{color:var(--resa)}
  .cabbtn{font-variant-numeric:tabular-nums}
  .cabbtn:not(.full){border-color:color-mix(in srgb,var(--resa) 45%,transparent);color:var(--resa)}
  .warn{background:var(--rappel-bg);border:1px solid color-mix(in srgb,var(--rappel) 35%,transparent);
    border-radius:11px;padding:12px 14px;font-size:var(--fs-sm);color:var(--ink);line-height:1.55;margin-bottom:16px}
  .warn b{display:block;margin-bottom:3px}
  .note{font-size:var(--fs-sm);margin:9px 0 0;min-height:17px;line-height:1.45}
  .note.err{color:var(--resa)} .note.ok{color:var(--info)}
  .linkout{width:100%;margin-top:10px;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;
    background:var(--surface-2);color:var(--ink-soft);font:inherit;font-size:var(--fs-xs)}

  /* ---- modale ---- */
  .modal{position:fixed;inset:0;z-index:90;background:rgba(20,19,12,.45);display:flex;align-items:flex-start;
    justify-content:center;padding:5vh 16px;overflow-y:auto}
  .modal[hidden]{display:none}
  .sheet{background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;
    box-shadow:0 20px 60px rgba(0,0,0,.28);width:720px;max-width:100%;padding:20px 22px 22px}
  .sheet.narrow{width:460px}
  .sheet h2{font-size:var(--fs-lg);margin:0;letter-spacing:-.2px}
  .sheet h2.bad{color:var(--resa)}
  .sheet .sh{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .sheet .sh .x{margin-left:auto;border:0;background:none;color:var(--ink-faint);font-size:22px;line-height:1;
    cursor:pointer;padding:2px 8px;border-radius:8px}
  .sheet .x:hover{background:var(--surface-2);color:var(--ink)}
  .sheet .lead{font-size:var(--fs-sm);color:var(--ink-soft);margin:0 0 14px;line-height:1.55}
  .sheet .acts{display:flex;gap:9px;justify-content:flex-end;margin-top:16px}

  .steps{list-style:none;margin:0;padding:0;font-size:var(--fs-sm)}
  .steps li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .steps li:last-child{border-bottom:0}
  .steps .st{width:18px;flex:0 0 auto;text-align:center}
  .steps .sx{flex:1;line-height:1.5}
  .steps .sx em{display:block;font-style:normal;font-size:var(--fs-xs);color:var(--ink-faint);margin-top:2px}

  /* ---- ecran de garde (pas connecte / pas administrateur) ---- */
  .gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
  .gate .sheet{text-align:center}
  .gate .logo{margin:0 auto 14px}

  @media (max-width:820px){
    .shell{grid-template-columns:1fr;height:auto}
    .side{border-right:0;border-bottom:1px solid var(--line)}
    .nav{flex-direction:row;overflow-x:auto;padding-bottom:10px}
    .side-foot{margin-top:0}
    .body{padding:18px 14px 50px}
    .head{padding:18px 14px 14px;position:static}
    .row2{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brandbox">
      <div class="logo">M</div>
      <div><span class="hn">Mylidie</span><span class="hs">Console d'administration</span></div>
    </div>
    <div class="navlbl">Pilotage</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      Connecté&nbsp;: <b id="me">…</b><br>Administrateur plateforme<br>
      <a href="../">← Application de réception</a>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="gate" id="gate" hidden></div>
<div class="modal" id="ov" hidden></div>

<script>
(function(){
  var $=function(s,r){return (r||document).querySelector(s)};
  var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var eur=function(n){return (n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'};

  // Rempli par build_app.py, exactement comme l'app de réception. Vide = la
  // console n'a rien à afficher : elle le dit au lieu d'inventer des chiffres.
  var SUPA={url:'https://gyimzmgctbhqjspsujcp.supabase.co',anon:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5aW16bWdjdGJocWpzcHN1amNwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MzY1MjMsImV4cCI6MjEwMzIxMjUyM30.EDBBGlKHhi0b2kaEGO7Le0nx3EUopsmt9X7EyyLcZE0'};
  var LIVE=!!SUPA.url;
  var TOKEN_KEY='mylidie_tok';           // même clé que l'app : /app/ et /app/admin/ partagent l'origine
  var FORM_SEPA='https://n8n-5tkb.srv1203069.hstgr.cloud/form/abonnement-mylidie';

  var MOTIFS=[['resa','Réservation'],['info','Information'],['annulation','Annulation'],
              ['rappel','Demande de rappel'],['urgence','Urgence'],['inconnu','Non identifié']];

  // La mention que le workflow d'envoi ajoute à chaque SMS. Elle n'est PAS
  // stockée en base (`messages.body` porte le texte de l'hôtel seul) : sans elle
  // le compte de segments serait faux d'un cran sur les messages longs.
  var MENTION='\n\nCe numero ne recoit pas de sms, appelez si besoin';

  // ---- tarifs unitaires ----------------------------------------------------
  // Convertis des tarifs fournisseurs en $ (voir Mylidie/couts.py) au taux 0,92.
  // ponytail: rangés dans le navigateur, pas en base. Un seul compte administre
  // la plateforme ; le jour où il y en a deux, une table `platform_settings`.
  var TARIF_DEF={el:0.0736,voix:0.0078,numero:1.242,segment:0.0734};
  var TARIF=(function(){
    try{return Object.assign({},TARIF_DEF,JSON.parse(localStorage.getItem('mylidie_tarifs')||'{}'))}
    catch(e){return Object.assign({},TARIF_DEF)}
  })();
  function saveTarifs(){try{localStorage.setItem('mylidie_tarifs',JSON.stringify(TARIF))}catch(e){}}

  // ---- segments SMS --------------------------------------------------------
  // Règles GSM 03.38. Source de vérité et cas de test : Mylidie/twilio/sms_segments.py.
  // Un seul caractère hors table (apostrophe typographique, « », ô…) bascule tout
  // le message en UCS-2 et divise la capacité par deux : d'où le comptage réel
  // plutôt qu'un « ×2 » forfaitaire.
  var GSM_BASE="@£$¥èéùìòÇ\nØø\rÅåΔ_ΦΓΛΩΠΨΣΘΞ\x1bÆæßÉ !\"#¤%&'()*+,-./0123456789:;<=>?"+
    "¡ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÑÜ§¿abcdefghijklmnopqrstuvwxyzäöñüà";
  var GSM_EXT="^{}\\[~]|€";
  function segments(txt){
    txt=String(txt||'');
    var n=0,uni=false;
    for(var i=0;i<txt.length;i++){
      var c=txt.charAt(i);
      if(GSM_BASE.indexOf(c)>=0)n+=1;
      else if(GSM_EXT.indexOf(c)>=0)n+=2;
      else{uni=true;break;}
    }
    if(uni)n=txt.length;
    var simple=uni?70:160, multi=uni?67:153;
    return n<=simple?1:Math.ceil(n/multi);
  }

  // ---- état ----------------------------------------------------------------
  var HOTELS=[],CALLS=[],MSGS=[],MEMBRES={},moi='';
  var vue='clients',hStat='all',perStat=30,d1='',d2='';
  var exH={},exQ={calls:true,transcripts:false,messages:false,feedback:false},exD1='',exD2='';

  function tok(){try{return localStorage.getItem(TOKEN_KEY)||''}catch(e){return ''}}
  function api(path,opt){
    opt=opt||{};opt.headers=Object.assign({apikey:SUPA.anon,Authorization:'Bearer '+tok(),
      'Content-Type':'application/json'},opt.headers||{});
    return fetch(SUPA.url+path,opt).then(function(r){
      if(r.status===401){gate('Session expirée','Reconnectez-vous à l\'application de réception, puis revenez ici.');
        throw new Error('401');}
      return r;
    });
  }
  function adminCall(payload){
    return fetch(SUPA.url+'/functions/v1/admin',{method:'POST',
      headers:{apikey:SUPA.anon,Authorization:'Bearer '+tok(),'Content-Type':'application/json'},
      body:JSON.stringify(payload)})
      .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
        // Le jeton dure une heure et rien ne le renouvelle. Passé ce délai la passerelle
        // Supabase répond {code,message} — sans champ `error` — et l'écran affichait
        // « Erreur inattendue » pour une simple session périmée. Même geste que api().
        if(r.status===401){gate('Session expirée','Reconnectez-vous à l\'application de réception, puis revenez ici.');
          throw new Error('401');}
        if(!r.ok)throw new Error(j.error||j.message||'Erreur inattendue.');return j;})});
  }

  // ---- dates ---------------------------------------------------------------
  function jour(d){return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'})}
  function iso(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
  function minuit(d){var x=new Date(d);x.setHours(0,0,0,0);return x}
  // La période retenue, en dates réelles. Elle sert au filtrage ET au prorata
  // des postes fixes (location du numéro, abonnement) : les deux doivent parler
  // du même nombre de jours, sinon la marge est fausse.
  function periode(){
    var fin=minuit(new Date()),deb;
    if(perStat===0&&d1&&d2){
      deb=minuit(new Date(d1));fin=minuit(new Date(d2));
    }else{
      deb=minuit(new Date());deb.setDate(deb.getDate()-(perStat||30)+1);
    }
    var jours=Math.max(1,Math.round((fin-deb)/86400000)+1);
    return {deb:deb,fin:fin,jours:jours};
  }
  function dansPeriode(iso_,p){
    var t=new Date(iso_).getTime();
    return t>=p.deb.getTime()&&t<p.fin.getTime()+86400000;
  }
  function fmtDur(s){s=Math.round(s||0);return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'}

  // ---- statistiques réelles ------------------------------------------------
  // ponytail: agrégation dans le navigateur, sur les lignes déjà chargées. Une
  // vue SQL deviendra nécessaire vers quelques dizaines de milliers d'appels ;
  // à 7 lignes, une requête d'agrégation par écran coûterait plus qu'elle ne
  // rapporte.
  function stats(ids,p){
    var set={};ids.forEach(function(i){set[i]=true});
    var cs=CALLS.filter(function(c){return set[c.hotel_id]&&dansPeriode(c.started_at,p)});
    var ms=MSGS.filter(function(m){return set[m.hotel_id]&&m.direction==='out'&&dansPeriode(m.created_at,p)});
    var secondes=cs.reduce(function(a,c){return a+(c.duration_secs||0)},0);
    var minutes=secondes/60;
    var segs=ms.reduce(function(a,m){return a+segments((m.body||'')+MENTION)},0);
    var prorata=p.jours/30;

    var c={el:minutes*TARIF.el,voix:minutes*TARIF.voix,
           numero:TARIF.numero*prorata*ids.length,segment:segs*TARIF.segment};
    c.total=c.el+c.voix+c.numero+c.segment;

    var revenu=HOTELS.filter(function(h){return set[h.id]&&h.billing_status==='payant'})
      .reduce(function(a,h){return a+(+h.subscription_eur||0)*prorata},0);

    // Série journalière : un point par jour de la période, zéros compris —
    // sinon le graphique tasse les trous et ment sur la régularité.
    var serie=[],idx={};
    cs.forEach(function(c2){var k=iso(new Date(c2.started_at));idx[k]=(idx[k]||0)+1});
    for(var d=new Date(p.deb);d<=p.fin;d.setDate(d.getDate()+1)){
      serie.push({d:new Date(d),n:idx[iso(d)]||0});
    }
    var rep=MOTIFS.map(function(m){
      return {cle:m[0],lbl:m[1],n:cs.filter(function(c3){return (c3.motif||'inconnu')===m[0]}).length};
    });
    return {serie:serie,total:cs.length,
            courts:cs.filter(function(c4){return (c4.duration_secs||0)<15}).length,
            moy:cs.length?secondes/cs.length:0,minutes:minutes,
            sms:ms.length,segments:segs,rep:rep,
            couts:c,revenu:revenu,marge:revenu-c.total};
  }
  function statsPrec(ids,p){
    var q={deb:new Date(p.deb),fin:new Date(p.fin),jours:p.jours};
    q.deb.setDate(q.deb.getDate()-p.jours);q.fin.setDate(q.fin.getDate()-p.jours);
    return stats(ids,q);
  }

  // ---- 1. établissements ---------------------------------------------------
  // ---- témoins de câblage --------------------------------------------------
  // Un hôtel peut exister en base et ne rien faire : c'est arrivé sur Soléo Prado,
  // dont la fiche était créée alors que ni l'agent ni le récap n'étaient branchés.
  // Chaque ligne ci-dessous est un fait LU dans la base, jamais une déclaration.
  // Ce qui vit chez Twilio ou ElevenLabs n'est pas vérifiable depuis le navigateur
  // (pas de clé côté client, et ces API refusent le CORS) : ces lignes disent
  // franchement « à vérifier à la main » au lieu d'afficher un vert mensonger.
  function cablage(h){
    var ap=CALLS.filter(function(c){return c.hotel_id===h.id}).length;
    var sm=MSGS.filter(function(m){return m.hotel_id===h.id&&m.direction==='out'}).length;
    return [
      ['Fiche établissement',      true,                              'créée en base'],
      ['Agent vocal ElevenLabs',   !!h.el_agent_id,                   h.el_agent_id||'aucun identifiant : le récap ne saura pas de quel hôtel vient l\'appel'],
      ['Numéro de l\'agent',        !!h.phone_e164,                    h.phone_e164||'aucun numéro'],
      ['Numéro d\'urgence',         !!h.emergency_e164,                h.emergency_e164||'sans lui l\'agent annonce un transfert qu\'il ne peut pas faire'],
      ['Logo du récapitulatif',    !!h.logo_url,                      h.logo_url?'renseigné':'le mail partira sans logo (il reste lisible)'],
      ['Destinataires du récap',   !!(h.recap_emails||[]).length,     (h.recap_emails||[]).join(', ')||'personne ne recevra le compte rendu'],
      ['Accès à l\'application',    !!MEMBRES[h.id],                   MEMBRES[h.id]?MEMBRES[h.id]+' compte(s)':'personne n\'est invité : l\'app s\'ouvrira vide'],
      ['Expéditeur SMS',           !!h.sms_sender_id,                 h.sms_sender_id||'aucun expéditeur alphanumérique'],
      ['Chaîne voix vérifiée',     ap>0,                              ap>0?ap+' appel(s) reçu(s)':'aucun appel encore reçu — appelez le numéro pour vérifier'],
      ['Chaîne SMS vérifiée',      sm>0,                              sm>0?sm+' SMS parti(s)':'aucun SMS encore envoyé']
    ];
  }
  function scoreCablage(h){
    var l=cablage(h),ok=l.filter(function(x){return x[1]}).length;

  function vueStats(){
    var tous=(hStat==='all'),h=tous?null:hotel(hStat);
    if(!tous&&!h){hStat='all';tous=true;}
    var ids=tous?HOTELS.map(function(x){return x.id}):[h.id];
    var p=periode();
    var st=stats(ids,p),pr=statsPrec(ids,p);
    var max=Math.max.apply(null,st.serie.map(function(x){return x.n}))||1;
    var delta=pr.total?Math.round((st.total-pr.total)/pr.total*100):null;
    var pcCourts=st.total?Math.round(st.courts/st.total*100):0;

    var opts='<option value="all"'+(tous?' selected':'')+'>Tous les établissements</option>'+
      HOTELS.map(function(x){
        return '<option value="'+esc(x.id)+'"'+(x.id===hStat?' selected':'')+'>'+esc(x.name)+'</option>'}).join('');

    var barres=st.serie.map(function(x){
      return '<div class="b" style="height:'+Math.round(x.n/max*100)+'%">'+
        '<span>'+jour(x.d)+' · '+x.n+' appel'+(x.n>1?'s':'')+'</span></div>';
    }).join('');

    var motifs=st.rep.map(function(m){
      var pc=st.total?Math.round(m.n/st.total*100):0;
      return '<div class="mrow"><div class="ml"><i class="md" style="background:var(--'+m.cle+')"></i>'+
        esc(m.lbl)+'</div><div class="mb"><i style="width:'+pc+'%;background:var(--'+m.cle+')"></i></div>'+
        '<div class="mv">'+m.n+' · '+pc+' %</div></div>';
    }).join('');

    var c=st.couts;
    var ligneCout=function(lbl,calc,val){
      return '<tr><td class="lbl"><b>'+lbl+'</b><div class="calc">'+calc+'</div></td>'+
             '<td class="right num">'+eur(val)+'</td></tr>';
    };
    var pcMarge=st.revenu?Math.round(st.marge/st.revenu*100):0;

    page('Statistiques',
      'Volume, motifs, et ce que l\'établissement coûte réellement. La période s\'applique à tout l\'écran. '+
      'Écran réservé à l\'administration — il n\'est pas montré aux hôtels.',
      '<div class="filters">'+
        '<div class="fld"><label for="sh">Établissement</label><select id="sh">'+opts+'</select></div>'+
        '<div class="fld"><label>Période</label><div class="seg" id="sper">'+
          [[7,'7 jours'],[30,'30 jours'],[90,'3 mois']].map(function(x){
            return '<button data-p="'+x[0]+'" aria-pressed="'+(perStat===x[0])+'">'+x[1]+'</button>'}).join('')+
          '<button data-p="0" aria-pressed="'+(perStat===0)+'">Personnalisée</button></div></div>'+
        (perStat===0?'<div class="fld"><label for="d1">Du</label><input type="date" id="d1" value="'+esc(d1)+'"></div>'+
                     '<div class="fld"><label for="d2">Au</label><input type="date" id="d2" value="'+esc(d2)+'"></div>':'')+
      '</div>'+

      '<div class="kpis">'+

  // ---- 3. exports ----------------------------------------------------------
  // CSV seulement. Excel ouvre un CSV, et un JSON se sort en une requête
  // PostgREST le jour où quelqu'un en a vraiment besoin.
  // ponytail: un fichier par jeu de données, pas d'archive — zipper demanderait
  // une librairie, et la CSP des Artifacts en interdit une distante.
  function csv(rows,cols){
    var q=function(v){
      if(v==null)return '';
      if(typeof v==='object')v=JSON.stringify(v);
      v=String(v);
      return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
    };
    // Séparateur point-virgule : Excel en locale française coupe là-dessus, et
    // la virgule est déjà dans les résumés d'appel.
    return '﻿'+cols.join(';')+'\r\n'+
      rows.map(function(r){return cols.map(function(c){return q(r[c])}).join(';')}).join('\r\n');
  }
  function telecharger(nom,texte){
    var b=new Blob([texte],{type:'text/csv;charset=utf-8'});
    var u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=nom;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(u)},1000);
  }
  function vueExports(){
    if(!exD1){var q=new Date();exD2=iso(q);q.setDate(q.getDate()-29);exD1=iso(q);}
    var p={deb:minuit(new Date(exD1)),fin:minuit(new Date(exD2)),jours:1};
    var lignes=HOTELS.map(function(h){
      var n=CALLS.filter(function(c){return c.hotel_id===h.id&&dansPeriode(c.started_at,p)}).length;
      return '<label class="chk"><input type="checkbox" data-eh="'+esc(h.id)+'"'+(exH[h.id]?' checked':'')+'>'+
        esc(h.name)+'<span class="cs">'+n+' appels</span></label>';
    }).join('')||'<div class="hsub">Aucun établissement.</div>';
    var jeux=[['calls','Appels','date, numéro, durée, motif, résumé'],
              ['transcripts','Transcriptions','le texte intégral de chaque conversation'],
              ['messages','SMS','envois, statut de livraison, contenu'],
              ['feedback','Retours bêta','remontées des utilisateurs de l\'app']]
      .map(function(x){
        return '<label class="chk"><input type="checkbox" data-eq="'+x[0]+'"'+(exQ[x[0]]?' checked':'')+'>'+
          '<span>'+x[1]+'<span class="hsub">'+x[2]+'</span></span></label>';
      }).join('');

    var selH=Object.keys(exH).filter(function(k){return exH[k]});
    var selQ=Object.keys(exQ).filter(function(k){return exQ[k]});

    page('Exports',
      'Sortir les données brutes d\'un ou plusieurs établissements, sur une période choisie. '+
      'Le fichier est généré dans le navigateur, il n\'est stocké nulle part.',
      '<div class="card"><h2>Établissements</h2><div class="in">'+
        '<div style="margin-bottom:10px"><button class="btn sm" id="exAll">Tout cocher</button> '+
        '<button class="btn sm" id="exNone">Tout décocher</button></div>'+
        '<div class="checks">'+lignes+'</div></div></div>'+

      '<div class="card"><h2>Période</h2><div class="in"><div class="filters" style="margin:0">'+
        '<div class="fld"><label for="ed1">Du</label><input type="date" id="ed1" value="'+esc(exD1)+'"></div>'+
        '<div class="fld"><label for="ed2">Au</label><input type="date" id="ed2" value="'+esc(exD2)+'"></div>'+
        '<div class="fld"><label>&nbsp;</label><div class="seg" id="eper">'+
          '<button data-e="30">30 jours</button><button data-e="90">3 mois</button>'+
          '<button data-e="0">Depuis le début</button></div></div>'+
      '</div></div></div>'+

      '<div class="card"><h2>Données à exporter</h2><div class="in"><div class="checks">'+jeux+'</div></div></div>'+

      '<div class="card"><h2>Fichier</h2><div class="in">'+
        '<div class="recap">Prêt à exporter : <b>'+selH.length+' établissement'+(selH.length>1?'s':'')+'</b>, '+
          '<b>'+selQ.length+' jeu'+(selQ.length>1?'x':'')+' de données</b>, du '+esc(exD1)+' au '+esc(exD2)+'. '+
          'Un fichier CSV par jeu de données, séparateur point-virgule (Excel français).</div>'+
        '<div style="margin-top:14px"><button class="btn primary" id="exGo">Générer l\'export</button> '+
          '<span id="exNote" class="hsub"></span></div>'+
      '</div></div>');

    $$('[data-eh]').forEach(function(c){c.addEventListener('change',function(){exH[c.dataset.eh]=c.checked;render()})});
    $$('[data-eq]').forEach(function(c){c.addEventListener('change',function(){exQ[c.dataset.eq]=c.checked;render()})});
    $('#exAll').addEventListener('click',function(){HOTELS.forEach(function(h){exH[h.id]=true});render()});
    $('#exNone').addEventListener('click',function(){exH={};render()});
    $('#ed1').addEventListener('change',function(){exD1=this.value;render()});
    $('#ed2').addEventListener('change',function(){exD2=this.value;render()});
    $$('#eper button').forEach(function(b){b.addEventListener('click',function(){
      var n=+b.dataset.e,q=new Date();exD2=iso(q);
      if(n){q.setDate(q.getDate()-n+1);exD1=iso(q);}else exD1='2026-01-01';
      render();
    })});
    $('#exGo').addEventListener('click',function(){lancerExport(selH,selQ,p)});
  }
  function lancerExport(selH,selQ,p){
    var note=$('#exNote');
    if(!selH.length||!selQ.length){note.textContent='Cochez au moins un établissement et un jeu de données.';return}
    note.textContent='Génération…';
    var nomH={};HOTELS.forEach(function(h){nomH[h.id]=h.name});
    var dans=function(x,champ){return selH.indexOf(x.hotel_id)>=0&&dansPeriode(x[champ],p)};
    var suffixe='_'+p.deb.toISOString().slice(0,10)+'_'+p.fin.toISOString().slice(0,10)+'.csv';
    var fait=0;

    if(selQ.indexOf('calls')>=0){
      var cs=CALLS.filter(function(c){return dans(c,'started_at')}).map(function(c){
        return {hotel:nomH[c.hotel_id],date:c.started_at,numero:c.from_e164,
                duree_s:c.duration_secs,motif:c.motif,resume:c.summary};
      });
      telecharger('appels'+suffixe,csv(cs,['hotel','date','numero','duree_s','motif','resume']));fait++;
    }
    if(selQ.indexOf('transcripts')>=0){
      // Une ligne par tour de parole : un CSV où toute la conversation tient
      // dans une cellule est illisible dans un tableur.
      var tr=[];
      CALLS.filter(function(c){return dans(c,'started_at')}).forEach(function(c){
        (c.transcript||[]).forEach(function(t,i){
          if(!t||!t.message)return;
          tr.push({hotel:nomH[c.hotel_id],date:c.started_at,appel:c.id,tour:i+1,
                   qui:t.role==='agent'?'agent':'client',texte:t.message});
        });
      });
      telecharger('transcriptions'+suffixe,csv(tr,['hotel','date','appel','tour','qui','texte']));fait++;
    }
    if(selQ.indexOf('messages')>=0){
      var ms=MSGS.filter(function(m){return dans(m,'created_at')}).map(function(m){
        return {hotel:nomH[m.hotel_id],date:m.created_at,sens:m.direction==='out'?'envoyé':'reçu',
                numero:m.phone_e164,statut:m.status,segments:segments((m.body||'')+MENTION),texte:m.body};
      });
      telecharger('sms'+suffixe,csv(ms,['hotel','date','sens','numero','statut','segments','texte']));fait++;
    }
    if(selQ.indexOf('feedback')>=0){
      // Les retours bêta ne sont pas chargés au démarrage : ils ne servent qu'ici.
      note.textContent='Génération…';
      api('/rest/v1/feedback?select=*&order=created_at.desc')
        .then(function(r){return r.json()})
        .then(function(rows){
          var fb=(rows||[]).filter(function(f){return dansPeriode(f.created_at,p)}).map(function(f){
            return {hotel:nomH[f.hotel_id]||'',date:f.created_at,auteur:f.user_email,
                    objet:f.subject,message:f.body,statut:f.status};
          });
          telecharger('retours-beta'+suffixe,csv(fb,['hotel','date','auteur','objet','message','statut']));
          note.textContent='✓ '+(fait+1)+' fichier'+(fait?'s':'')+' téléchargé'+(fait?'s':'')+'.';
        })
        .catch(function(){note.textContent='Les retours bêta n\'ont pas pu être lus.'});
      return;
    }
    note.textContent='✓ '+fait+' fichier'+(fait>1?'s':'')+' téléchargé'+(fait>1?'s':'')+'.';
  }

  // ---- 4. nouvel établissement ---------------------------------------------

  // ---- chargement ----------------------------------------------------------
  // ponytail: tout est chargé une fois au démarrage, les écrans travaillent en
  // mémoire. Plafond assumé à 5 000 lignes ; au-delà, agréger côté SQL.
  function charger(){
    return Promise.all([
      api('/rest/v1/hotels?select=id,name,slug,address,phone_e164,sms_sender_id,el_agent_id,'+
          'emergency_e164,logo_url,recap_emails,'+
          'billing_status,subscription_eur,created_at&order=name.asc').then(function(r){return r.json()}),
      api('/rest/v1/calls?select=id,hotel_id,started_at,duration_secs,from_e164,motif,summary,transcript'+
          '&order=started_at.desc&limit=5000').then(function(r){return r.json()}),
      api('/rest/v1/messages?select=id,hotel_id,direction,body,phone_e164,status,created_at'+
          '&order=created_at.desc&limit=5000').then(function(r){return r.json()}),
      api('/rest/v1/hotel_members?select=hotel_id,role').then(function(r){return r.json()})
    ]).then(function(x){
      HOTELS=x[0]||[];CALLS=x[1]||[];MSGS=x[2]||[];
      MEMBRES={};(x[3]||[]).forEach(function(m){MEMBRES[m.hotel_id]=(MEMBRES[m.hotel_id]||0)+1});
      HOTELS.forEach(function(h){if(!(h.id in exH))exH[h.id]=true});
    });
  }

  function render(){
    if(vue==='clients')vueClients();
    else if(vue==='stats')vueStats();
    else if(vue==='exports')vueExports();
    else vueNew();
  }

  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'&&!$('#ov').hidden)fermer();
  });
  window.addEventListener('hashchange',function(){
    var v=(location.hash||'').replace('#','');
    if(v&&v!==vue&&VUES().some(function(x){return x.id===v})){vue=v;renderNav();render()}
  });

  // ---- démarrage -----------------------------------------------------------
  if(!LIVE){
    gate('Console non connectée',
      'Ce fichier est la source ; la version déployée est générée par build_app.py, '+
      'qui y injecte l\'adresse Supabase.');
    return;
  }
  var p=jwtPayload(tok());
  if(!tok()||!p.email){
    gate('Connexion requise','Connectez-vous à l\'application de réception, puis revenez sur cette page.');
    return;
  }
  if(!(p.app_metadata&&p.app_metadata.mylidie_admin===true)){
    gate('Réservé à l\'administration','Ce compte n\'a pas les droits d\'administrateur de la plateforme.');
    return;
  }
  moi=p.email;
  vue=(location.hash||'').replace('#','')||'clients';
  if(!VUES().some(function(v){return v.id===vue}))vue='clients';

  $('#shell').hidden=false;
  $('#me').textContent=moi;
  $('#main').innerHTML='<div class="head"><h1>Chargement…</h1></div>';
  charger().then(function(){renderNav();render()})
    .catch(function(e){
      if(String(e.message)==='401')return;
      $('#main').innerHTML='<div class="head"><h1>Lecture impossible</h1>'+
        '<p>La base n\'a pas répondu. Rechargez la page dans un instant.</p></div>';
    });
})();
</script>

</body>
</html>
